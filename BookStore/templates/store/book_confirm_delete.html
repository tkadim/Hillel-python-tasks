{% extends 'base.html' %}

{% block title %}{{ book.title }}{% endblock %}

{% block content %}

  <h1>Delete the book?</h1>
    <p>Are You sure You want to delete "{{ object.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete it</button>
        <a href="{% url 'index' %}">Cancel</a>
    </form>

{% endblock %}
