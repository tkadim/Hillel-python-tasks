{% extends 'base.html' %}

{% block title %}{{ book.title }}{% endblock %}

{% block content %}

  <h1>Видалити книгу?</h1>
    <p>Ви впевнені, що хочете видалити "{{ object.title }}"? Цю дію не можна скасувати.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Так, видалити</button>
        <a href="{% url 'index' %}">Скасувати</a>
    </form>

{% endblock %}
