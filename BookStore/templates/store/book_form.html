{% extends 'base.html' %}

{% block title %}{{ book.title }}{% endblock %}

{% block content %}

  <h1>{% if object %}Update Book{% else %}Add Book{% endif %}</h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>

{% endblock %}
